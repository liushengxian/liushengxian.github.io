    <p>整理自己的笔记时候发现了一首18年的“诗”。</p>
<pre tabindex="0"><code>雨中。却道是。
念去去，千里烟波
雨朦胧。佳人何在？
</code></pre><p>现在自己的心态完全不同，于是昨天续了下半段：</p>
<pre tabindex="0"><code>夜深。嗟叹乎。
笑呵呵，万古长宵
夜安详。意气风发！
</code></pre><p>哈哈哈哈哈哈哈！</p>
