<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Calculator</title>
    <!-- 发布新版本时，请同步更新：①下方版本号 ②本文件所有资源引用的 ?v= ③各 JS 模块之间 import 的 ?v=
         （约定：所有 .css / .js 引用共用同一个版本号，发版时整体替换） -->
    <link rel="stylesheet" href="./base.css?v=4.9.1">
    <link rel="stylesheet" href="./app.css?v=4.9.1">
</head>
<body>
    <div class="app-shell">
        <header class="app-header">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true">¥</span>
                <div class="brand-text">
                    <h1>AI Calculator</h1>
                    <p class="brand-sub">同业资金分段计息</p>
                </div>
            </div>
            <div class="header-actions">
                <span class="version-chip">姜行专用 4.9.1（模块化）</span>
                <button id="settingsBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="8" x2="20" y2="8"></line><line x1="4" y1="16" x2="20" y2="16"></line><circle cx="9" cy="8" r="2"></circle><circle cx="15" cy="16" r="2"></circle></svg>
                    输出设置
                </button>
            </div>
        </header>

        <!-- 参数条：按使用频率排（起始日每次动 → 供应商/模型常切 → 规则偶用 → Key 一次性） -->
        <section class="params" aria-label="计算参数">
            <div class="field param param-date">
                <label for="startDate">起始日</label>
                <input type="date" id="startDate">
            </div>
            <div class="field param">
                <label for="providerSelect">供应商</label>
                <select id="providerSelect">
                    <option value="">加载中...</option>
                </select>
            </div>
            <div class="field param param-model">
                <label for="modelSelect">模型</label>
                <select id="modelSelect"></select>
                <input type="text" id="modelInput" placeholder="自定义模型名称" spellcheck="false" hidden>
            </div>
            <div class="field param param-rule" id="ruleField" hidden>
                <label for="ruleSelect">规则</label>
                <select id="ruleSelect">
                    <option value="">加载中...</option>
                </select>
            </div>
            <div class="param-key">
                <button type="button" id="keyToggle" class="key-toggle" data-state="missing" aria-expanded="false" aria-controls="keyRow">
                    <span class="key-dot" aria-hidden="true"></span>
                    <span id="keyState">未配置 Key</span>
                </button>
            </div>
        </section>

        <!-- API Key：低频，点状态按钮才展开 -->
        <div class="key-row" id="keyRow" hidden>
            <div class="field key-field">
                <label for="apiKey" id="apiKeyLabel">DeepSeek API Key</label>
                <input type="password" id="apiKey" placeholder="请输入你的 DeepSeek API Key" autocomplete="off" spellcheck="false">
            </div>
            <p class="key-note">只保存在本机浏览器，不会上传</p>
        </div>

        <section class="workbench">
            <div class="pane pane-input">
                <div class="pane-head">
                    <span class="pane-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"></path><path d="m7 10 5 5 5-5"></path><path d="M5 21h14"></path></svg>
                    </span>
                    <div class="pane-title">
                        <label for="inputText">输入内容</label>
                        <span class="pane-sub">粘贴银行报价原文</span>
                    </div>
                </div>
                <div class="pane-body">
                    <textarea id="inputText" placeholder="请输入你的问题或内容..."></textarea>
                    <div class="pane-empty" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v4a1 1 0 0 0 1 1h4"></path><path d="M5 3h9l5 5v13H5z"></path><path d="M9 13h6"></path><path d="M9 17h4"></path></svg>
                        <p>粘贴报价原文即可</p>
                        <p class="pane-empty-hint">如「【定期】2026年7月1日-10日 … 4/5m 1.51」</p>
                    </div>
                </div>
                <div class="pane-foot">
                    <span>支持多段日期 + 多档价格</span>
                </div>
            </div>

            <div class="pane pane-output">
                <div class="pane-head">
                    <span class="pane-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"></path></svg>
                    </span>
                    <div class="pane-title">
                        <label for="outputText">返回内容</label>
                        <span class="pane-sub">等宽排版 · 可直接复制</span>
                    </div>
                    <button id="copyBtn" disabled>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15V5a2 2 0 0 1 2-2h10"></path></svg>
                        <span class="copy-label">一键复制</span>
                    </button>
                </div>
                <div class="pane-body">
                    <textarea id="outputText" placeholder="计算结果将显示在这里..." readonly></textarea>
                    <div class="pane-empty" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v14H4z"></path><path d="M8 9h8"></path><path d="M8 13h5"></path></svg>
                        <p>结果会显示在这里</p>
                        <p class="pane-empty-hint">点「计算」或按 ⌘/Ctrl + Enter</p>
                    </div>
                </div>
                <div class="pane-foot">
                    <span>复制到聊天窗口不会串行</span>
                    <span class="pane-meta" id="outputMeta" data-state="idle">待计算</span>
                </div>
            </div>
        </section>

        <div class="action-bar">
            <div id="status" role="status" aria-live="polite"></div>
            <div class="action-buttons">
                <button id="calculateBtn">计算<kbd class="kbd-hint">⌘↵</kbd></button>
                <button id="clearBtn">清空</button>
            </div>
        </div>
    </div>

    <!-- 输出设置对话框 -->
    <dialog id="settingsDialog">
        <article>
            <header>
                <h3>输出设置</h3>
                <p class="dialog-sub">只影响输出文本的排版，不改动计算结果</p>
            </header>
            <form method="dialog" id="settingsForm">
                <div class="settings-grid">
                    <label class="span-2" for="headerInput">
                        标题（留空则不显示）
                        <input type="text" id="headerInput" spellcheck="false" autofocus>
                    </label>

                    <label for="dateFormatInput">
                        日期格式（占位符 YYYY / MM / DD）
                        <input type="text" id="dateFormatInput" spellcheck="false" placeholder="YYYY年MM月DD日">
                    </label>

                    <label for="totalFormatInput">
                        合计文案（占位符 {金额} / {单位}）
                        <input type="text" id="totalFormatInput" spellcheck="false" placeholder="合计{金额}{单位}">
                    </label>

                    <fieldset class="settings-blanks span-2">
                        <legend>空行数（0–3）</legend>
                        <label for="blankAfterHeader">标题与明细之间</label>
                        <input type="number" id="blankAfterHeader" min="0" max="3" step="1" inputmode="numeric">
                        <label for="blankBetweenRows">明细行之间</label>
                        <input type="number" id="blankBetweenRows" min="0" max="3" step="1" inputmode="numeric">
                        <label for="blankBeforeTail">合计/结束语之前</label>
                        <input type="number" id="blankBeforeTail" min="0" max="3" step="1" inputmode="numeric">
                        <label for="blankAfterTotal">合计与结束语之间</label>
                        <input type="number" id="blankAfterTotal" min="0" max="3" step="1" inputmode="numeric">
                    </fieldset>

                    <label class="span-2" for="suffixText">
                        尾部追加词（留空则不追加）
                        <textarea id="suffixText" rows="3" placeholder="在这里输入内容..."></textarea>
                    </label>

                    <div class="span-2">
                        <div class="preview-head">
                            <span class="preview-title">预览</span>
                            <span class="preview-tag" id="previewTag" data-state="sample">示例数据</span>
                        </div>
                        <pre id="settingsPreview"></pre>
                    </div>
                </div>
                <footer>
                    <button type="button" id="cancelBtn">取消</button>
                    <button type="submit" id="saveBtn">保存</button>
                </footer>
            </form>
        </article>
        <!-- 关闭放在最后：绝对定位仍显示在右上角，但 Tab 顺序排在字段与按钮之后 -->
        <button type="submit" form="settingsForm" class="dialog-close" aria-label="关闭">×</button>
    </dialog>

    <script type="module" src="index.js?v=4.9.1"></script>
</body>
</html>
